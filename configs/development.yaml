# Development configuration file for the Repair Claude Code Desktop session history application.

General:
  AppName: claude-session-repair
  CheckInterval: 4

Files:
  LogfileName: logs/logfile.log
  LogfileMaxLines: 10000
  LogProcessID: False
  LogfileVerbosity: debug
  ConsoleVerbosity: debug

Email:
  EnableEmail: True
  SubjectPrefix: "[Dev claude-session-repair]: "


HeartbeatMonitor:
  Enable: True
  WebsiteURL: https://uptime.betterstack.com/api/v1/heartbeat/zcsNtnEQHRDNWJENvcZc94fx
  HeartbeatTimeout: 5