# Production configuration file for the Repair Claude Code Desktop session history application.

General:
  AppName: claude-session-repair
  CheckInterval: 30

Files:
  LogfileName: logs/logfile.log
  LogfileMaxLines: 10000
  LogProcessID: False
  LogfileVerbosity: detailed
  ConsoleVerbosity: detailed

Email:
  EnableEmail: True
  SubjectPrefix: "[claude-session-repair]: "

HeartbeatMonitor:
  Enable: False
  WebsiteURL: 
  HeartbeatTimeout: 5